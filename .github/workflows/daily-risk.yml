name: daily-risk
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python backend/predict.py
        working-directory: .
        env: { PYTHONUNBUFFERED: "1" }
      - run: python backend/hotspots.py
      - run: |
          git config user.name "phoenix-bot"; git config user.email "bot@users.noreply.github.com"
          git add public/data/risk-haut-katanga.json public/data/hotspots-haut-katanga.json
          if ! git diff --cached --quiet; then git commit -m "Daily risk update" && git push; fi
